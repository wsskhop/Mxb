name: Mxb
version: 1.0.0
main: com.example.mxb.MxbPlugin
api-version: '1.21'
author: YourName
description: 管理员封禁插件

commands:
  mxb:
      description: 打开封禁管理菜单
          usage: '/mxb [unban|history|clearwarn|help]'
              aliases: [mxban]

              permissions:
                mxb.admin:
                    description: 允许使用 /mxb
                        default: op